# Convenience delegate for running Alembic from the repo root (e.g.
# `uv run --project backend alembic upgrade head`, which uses backend's venv but does
# not change directory into backend/). The canonical config is backend/alembic.ini —
# this just points at the same script_location so migrations aren't invoked from the
# wrong directory and fail to find their config at all.
#
# Prefer the documented form when you can: `cd backend && uv run alembic upgrade head`.

[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = .
path_separator = os
